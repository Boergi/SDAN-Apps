networks:
  app_net:
    driver: bridge
  proxy_net:
    external: true
    name: ${PROXY_NETWORK:-proxy_net}

volumes:
  taiga-db-data:
  taiga-static-data:
  taiga-media-data:
  taiga-async-rabbitmq-data:
  taiga-events-rabbitmq-data:

x-restart-policy: &restart_policy
  restart: unless-stopped

x-back-environment: &back_environment
  POSTGRES_DB: taiga
  POSTGRES_USER: ${POSTGRES_USER:-taiga}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p4ssw0rd}
  POSTGRES_HOST: taiga-db
  TAIGA_SECRET_KEY: ${SECRET_KEY:-OVERWRITE_ME}
  TAIGA_SITES_SCHEME: ${TAIGA_SCHEME:-https}
  TAIGA_SITES_DOMAIN: ${TAIGA_DOMAIN:-taiga.deinedomain.de}
  TAIGA_SUBPATH: ${SUBPATH:-}
  EMAIL_BACKEND: django.core.mail.backends.${EMAIL_BACKEND:-console}.EmailBackend
  DEFAULT_FROM_EMAIL: ${EMAIL_DEFAULT_FROM:-taiga@deinedomain.de}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.example.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-OVERWRITE_ME}
  RABBITMQ_USER: ${RABBITMQ_USER:-taiga}
  RABBITMQ_PASS: ${RABBITMQ_PASS:-OVERWRITE_ME}
  ENABLE_TELEMETRY: ${ENABLE_TELEMETRY:-False}
  ATTACHMENTS_MAX_AGE: ${ATTACHMENTS_MAX_AGE:-360}
  PUBLIC_REGISTER_ENABLED: ${PUBLIC_REGISTER_ENABLED:-False}
  ENABLE_GITHUB_AUTH: ${ENABLE_GITHUB_AUTH:-False}
  GITHUB_API_CLIENT_ID: ${GITHUB_API_CLIENT_ID:-}
  GITHUB_API_CLIENT_SECRET: ${GITHUB_API_CLIENT_SECRET:-}
  ENABLE_GITLAB_AUTH: ${ENABLE_GITLAB_AUTH:-False}
  GITLAB_API_CLIENT_ID: ${GITLAB_API_CLIENT_ID:-}
  GITLAB_API_CLIENT_SECRET: ${GITLAB_API_CLIENT_SECRET:-}
  GITLAB_URL: ${GITLAB_URL:-}
  ENABLE_SLACK: ${ENABLE_SLACK:-False}
  ENABLE_GITHUB_IMPORTER: ${ENABLE_GITHUB_IMPORTER:-False}
  GITHUB_IMPORTER_CLIENT_ID: ${GITHUB_IMPORTER_CLIENT_ID:-}
  GITHUB_IMPORTER_CLIENT_SECRET: ${GITHUB_IMPORTER_CLIENT_SECRET:-}
  ENABLE_JIRA_IMPORTER: ${ENABLE_JIRA_IMPORTER:-False}
  JIRA_IMPORTER_CONSUMER_KEY: ${JIRA_IMPORTER_CONSUMER_KEY:-}
  JIRA_IMPORTER_CERT: ${JIRA_IMPORTER_CERT:-}
  JIRA_IMPORTER_PUB_CERT: ${JIRA_IMPORTER_PUB_CERT:-}
  ENABLE_TRELLO_IMPORTER: ${ENABLE_TRELLO_IMPORTER:-False}
  TRELLO_IMPORTER_API_KEY: ${TRELLO_IMPORTER_API_KEY:-}
  TRELLO_IMPORTER_SECRET_KEY: ${TRELLO_IMPORTER_SECRET_KEY:-}

services:
  taiga-db:
    image: postgres:${POSTGRES_VERSION:-12.3}
    <<: *restart_policy
    environment:
      POSTGRES_DB: taiga
      POSTGRES_USER: ${POSTGRES_USER:-taiga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p4ssw0rd}
    volumes:
      - taiga-db-data:/var/lib/postgresql/data
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taiga} -d taiga"]
      interval: 5s
      timeout: 5s
      retries: 10

  taiga-async-rabbitmq:
    image: rabbitmq:3.8-management-alpine
    <<: *restart_policy
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-OVERWRITE_ME}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-taiga}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-OVERWRITE_ME}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-taiga}
    volumes: [taiga-async-rabbitmq-data:/var/lib/rabbitmq]
    networks: [app_net]

  taiga-events-rabbitmq:
    image: rabbitmq:3.8-management-alpine
    <<: *restart_policy
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-OVERWRITE_ME}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-taiga}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-OVERWRITE_ME}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-taiga}
    volumes: [taiga-events-rabbitmq-data:/var/lib/rabbitmq]
    networks: [app_net]

  taiga-back:
    image: taigaio/taiga-back:${TAG:-6.9.0}
    <<: *restart_policy
    environment: *back_environment
    volumes:
      - taiga-static-data:/taiga-back/static
      - taiga-media-data:/taiga-back/media
    networks: [app_net]
    depends_on:
      taiga-db: {condition: service_healthy}
      taiga-events-rabbitmq: {condition: service_started}
      taiga-async-rabbitmq: {condition: service_started}

  taiga-async:
    image: taigaio/taiga-back:${TAG:-6.9.0}
    <<: *restart_policy
    entrypoint: [/taiga-back/docker/async_entrypoint.sh]
    environment: *back_environment
    volumes:
      - taiga-static-data:/taiga-back/static
      - taiga-media-data:/taiga-back/media
    networks: [app_net]
    depends_on:
      taiga-db: {condition: service_healthy}
      taiga-events-rabbitmq: {condition: service_started}
      taiga-async-rabbitmq: {condition: service_started}

  taiga-front:
    image: taigaio/taiga-front:${TAG:-6.9.0}
    <<: *restart_policy
    environment:
      TAIGA_URL: ${TAIGA_SCHEME:-https}://${TAIGA_DOMAIN:-taiga.deinedomain.de}
      TAIGA_WEBSOCKETS_URL: ${WEBSOCKETS_SCHEME:-wss}://${TAIGA_DOMAIN:-taiga.deinedomain.de}
      TAIGA_SUBPATH: ${SUBPATH:-}
      PUBLIC_REGISTER_ENABLED: ${PUBLIC_REGISTER_ENABLED_FRONT:-false}
      ENABLE_GITHUB_AUTH: ${ENABLE_GITHUB_AUTH_FRONT:-false}
      GITHUB_CLIENT_ID: ${GITHUB_API_CLIENT_ID:-}
      ENABLE_GITLAB_AUTH: ${ENABLE_GITLAB_AUTH_FRONT:-false}
      GITLAB_CLIENT_ID: ${GITLAB_API_CLIENT_ID:-}
      GITLAB_URL: ${GITLAB_URL:-}
      ENABLE_SLACK: ${ENABLE_SLACK_FRONT:-false}
      ENABLE_GITHUB_IMPORTER: ${ENABLE_GITHUB_IMPORTER_FRONT:-false}
      ENABLE_JIRA_IMPORTER: ${ENABLE_JIRA_IMPORTER_FRONT:-false}
      ENABLE_TRELLO_IMPORTER: ${ENABLE_TRELLO_IMPORTER_FRONT:-false}
    networks: [app_net]

  taiga-events:
    image: taigaio/taiga-events:${TAG:-6.9.0}
    <<: *restart_policy
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-taiga}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-OVERWRITE_ME}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-taiga}
      TAIGA_SECRET_KEY: ${SECRET_KEY:-OVERWRITE_ME}
    networks: [app_net]
    depends_on: [taiga-events-rabbitmq]

  taiga-protected:
    image: taigaio/taiga-protected:${TAG:-6.9.0}
    <<: *restart_policy
    environment:
      MAX_AGE: ${ATTACHMENTS_MAX_AGE:-360}
      SECRET_KEY: ${SECRET_KEY:-OVERWRITE_ME}
    networks: [app_net]

  taiga-gateway:
    image: nginx:1.19-alpine
    <<: *restart_policy
    volumes:
      - ./taiga-gateway/taiga.conf:/etc/nginx/conf.d/default.conf:ro
      - taiga-static-data:/taiga/static:ro
      - taiga-media-data:/taiga/media:ro
    networks:
      app_net:
      proxy_net:
        aliases: [taiga]
    depends_on: [taiga-front, taiga-back, taiga-events, taiga-protected]
    labels: [autoheal=true]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
