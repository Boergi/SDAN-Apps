networks:
  app_net:
    driver: bridge

  proxy_net:
    external: true
    name: ${PROXY_NETWORK:-proxy_net}

volumes:
  db_data:
  userfiles:
  public_userfiles:
  plugins:
  logs:

services:
  db:
    image: mysql:${MYSQL_VERSION:-8.4}
    restart: unless-stopped
    command: --character-set-server=UTF8MB4 --collation-server=UTF8MB4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${LEAN_DB_DATABASE:-leantime}
      MYSQL_USER: ${LEAN_DB_USER:-leantime}
      MYSQL_PASSWORD: ${LEAN_DB_PASSWORD:-p4ssw0rd}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-p4ssw0rd}
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: leantime/leantime:${TAG:-3.4.12}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_add:
      - CAP_CHOWN
      - CAP_SETGID
      - CAP_SETUID
    networks:
      app_net:
      proxy_net:
        aliases:
          - leantime
    environment:
      LEAN_APP_URL: "${LEAN_APP_URL:-}"
      LEAN_APP_DIR: "${LEAN_APP_DIR:-}"
      LEAN_DEBUG: "${LEAN_DEBUG:-0}"
      LEAN_DB_HOST: "db"
      LEAN_DB_USER: "${LEAN_DB_USER:-leantime}"
      LEAN_DB_PASSWORD: "${LEAN_DB_PASSWORD:-p4ssw0rd}"
      LEAN_DB_DATABASE: "${LEAN_DB_DATABASE:-leantime}"
      LEAN_DB_PORT: "3306"
      LEAN_SESSION_PASSWORD: "${LEAN_SESSION_PASSWORD:-OVERWRITE_ME}"
      LEAN_SITENAME: "${LEAN_SITENAME:-Leantime}"
      LEAN_LANGUAGE: "${LEAN_LANGUAGE:-en-US}"
      LEAN_DEFAULT_TIMEZONE: "${LEAN_DEFAULT_TIMEZONE:-Europe/Berlin}"
      LEAN_LOG_PATH: ""
      LEAN_LOG_CHANNELS: "stderr"
    volumes:
      - public_userfiles:/var/www/html/public/userfiles
      - userfiles:/var/www/html/userfiles
      - plugins:/var/www/html/app/Plugins
      - logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s